{% extends "base.html" %}{% block title %}Data Guru{% endblock %}{% block content %}<section class="pagehead"><h1>Data Guru</h1></section><section class="section two"><form method="post" class="card"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><h2>Tambah guru</h2><label>Nama lengkap<input name="name" required></label><label>Mata pelajaran<input name="subject"></label><label>Email<input type="email" name="email"></label><button class="btn">Simpan</button></form><div class="grid">{% for x in items %}<article class="card"><span>👩‍🏫</span><h3>{{x.name}}</h3><p>{{x.subject}}</p><small>{{x.email}}</small></article>{% else %}<p>Belum ada data guru.</p>{% endfor %}</div></section>{% endblock %}
