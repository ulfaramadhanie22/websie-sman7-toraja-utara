{% extends "base.html" %}{% block title %}Nilai{% endblock %}{% block content %}<section class="pagehead"><h1>Nilai Siswa</h1></section><section class="section two"><form method="post" class="card"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><h2>Tambah nilai</h2><label>Siswa<select name="student_id" required><option value="">Pilih siswa</option>{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}}</option>{% endfor %}</select></label><label>Mata pelajaran<input name="subject" required></label><label>Jenis asesmen<input name="assessment"></label><label>Nilai (0–100)<input type="number" name="score" min="0" max="100" step=".01" required></label><button class="btn">Simpan</button></form><div><h2>Rekap nilai</h2><div class="tablebox"><table><tr><th>Nama</th><th>Kelas</th><th>Pelajaran</th><th>Asesmen</th><th>Nilai</th></tr>{% for x in items %}<tr><td>{{x.name}}</td><td>{{x.class_name}}</td><td>{{x.subject}}</td><td>{{x.assessment}}</td><td>{{x.score}}</td></tr>{% else %}<tr><td colspan="5">Belum ada nilai.</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
