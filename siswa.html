{% extends "base.html" %}{% block title %}Data Siswa{% endblock %}{% block content %}<section class="pagehead"><h1>Data Siswa</h1><p>Kelola data siswa sekolah.</p></section><section class="section two"><form method="post" class="card"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><h2>Tambah siswa</h2><label>NIS<input name="nis"></label><label>Nama lengkap<input name="name" required></label><label>Kelas<input name="class_name" placeholder="XII Sains 1"></label><label>Jenis kelamin<select name="gender"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></label><button class="btn">Simpan</button></form><div><h2>Daftar siswa</h2><div class="tablebox"><table><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>JK</th></tr>{% for x in items %}<tr><td>{{x.nis}}</td><td>{{x.name}}</td><td>{{x.class_name}}</td><td>{{x.gender}}</td></tr>{% else %}<tr><td colspan="4">Belum ada siswa.</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
